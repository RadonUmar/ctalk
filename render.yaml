services:
  - type: web
    name: ctalk-relay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn relay:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RELAY_DB_PATH
        value: /var/data/relay.sqlite3
    disk:
      name: ctalk-data
      mountPath: /var/data
      sizeGB: 1
